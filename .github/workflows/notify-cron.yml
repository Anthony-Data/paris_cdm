name: Push Notifications Cron

on:
  schedule:
    # Planifié toutes les 5 min — GitHub Actions throttle en pratique à ~1/h.
    # La fenêtre côté serveur est élargie à 55 min pour compenser.
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Appel API notify (push notifications matchs)
        run: |
          STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}" "${{ secrets.VERCEL_APP_URL }}/api/notify")
          echo "HTTP status: $STATUS"
          echo "Réponse: $(cat /tmp/resp.json)"
          if [ "$STATUS" -ge 500 ]; then
            echo "Erreur serveur ($STATUS)" && exit 1
          fi
