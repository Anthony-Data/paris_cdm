name: Notifications 1h avant match

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Appel endpoint notify
        run: |
          response=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
            "https://paris-cdm.vercel.app/api/notify")
          body=$(cat /tmp/body.txt)
          echo "HTTP $response : $body"
          if [ "$response" != "200" ]; then
            echo "::error::Notify échoué (HTTP $response)"
            exit 1
          fi
