name: Push Notifications Cron

on:
  schedule:
    # Toutes les 5 minutes — déclenche l'envoi des notifs de match côté serveur
    # (remplace Vercel Cron, indisponible sur plan Hobby)
    - cron: '*/5 * * * *'
  workflow_dispatch: # permet un déclenchement manuel depuis GitHub Actions

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Appel API notify (push notifications matchs)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.VERCEL_APP_URL }}/api/notify")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" -ge 500 ]; then
            echo "Erreur serveur ($STATUS)" && exit 1
          fi
