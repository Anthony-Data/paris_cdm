name: Keepalive Subscriptions Cron

on:
  schedule:
    # Toutes les heures — maintient les endpoints APNS en vie et nettoie les morts (410)
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Appel API keepalive (maintien endpoints push)
        run: |
          STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}" "${{ secrets.VERCEL_APP_URL }}/api/keepalive")
          echo "HTTP status: $STATUS"
          cat /tmp/resp.json
          if [ "$STATUS" -ge 500 ]; then
            echo "Erreur serveur ($STATUS)" && exit 1
          fi
